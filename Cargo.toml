[package]
name = "coutcouticket"
version = "0.1.0"
description = "Système de tickets et de notes pour Claude Code, piloté par fichiers Markdown"
rust-version = "1.89"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
notify = "8.2.0"
rmcp = { version = "3.4.0", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "io-std", "net", "signal", "sync", "time"] }
tokio-util = "0.7.19"
toml = "1.1.6"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
