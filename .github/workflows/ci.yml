# Tests à chaque push sur main et sur chaque pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    # macOS : cible principale (FSEvents, launchd). Windows : tâche planifiée, Git for Windows.
    # Gratuit pour un dépôt public.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        # Tout avertissement fait échouer la CI (ticket 0023).
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Tests
        run: cargo test --locked --no-fail-fast
        env:
          # Windows : installe réellement la tâche planifiée du démon (runner jetable).
          COUTCOUTICKET_TEST_WINDOWS_SERVICE: ${{ runner.os == 'Windows' && '1' || '' }}
      - name: Script d'installation
        if: runner.os == 'macOS'
        run: sh -n install.sh
      - name: Script d'installation (Windows, archive locale)
        if: runner.os == 'Windows'
        # Windows PowerShell 5.1 : la version présente sur tous les postes.
        shell: powershell
        run: |
          $name = "coutcouticket-0.0.0-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/debug/coutcouticket.exe, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLower()
          Set-Content -NoNewline -Path "dist/$name.zip.sha256" -Value "$hash  $name.zip"
          $env:COUTCOUTICKET_BASE_URL = ([Uri](Resolve-Path dist).Path).AbsoluteUri
          $dir = Join-Path $env:RUNNER_TEMP 'cct-bin'
          ./install.ps1 -Version 0.0.0 -Dir $dir
          ./install.ps1 -Version 0.0.0 -Dir $dir
          & (Join-Path $dir 'coutcouticket.exe') --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
