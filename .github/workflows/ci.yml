# Tests à chaque push sur main et sur chaque pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # macOS : cible réelle du projet (FSEvents, launchd). Gratuit pour un dépôt public.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        # Tout avertissement fait échouer la CI (ticket 0023).
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Script d'installation
        run: sh -n install.sh
