<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coutcouticket</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc;
  --accent: #2f5d50; --p0: #b42318; --p1: #c4661f; --p2: #52606d; --p3: #9aa3ab;
  --warn-bg: #fdf1e7; --warn-ink: #8a4a12; --chip: #efede8; --shadow: 0 1px 2px rgba(0,0,0,.06);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161715; --panel: #1f201e; --ink: #e8e6e1; --muted: #9a988f; --line: #30312e;
    --accent: #7fb8a4; --p0: #f0776c; --p1: #e8a064; --p2: #a3adb8; --p3: #6d757c;
    --warn-bg: #3a2a1c; --warn-ink: #f0c08a; --chip: #2a2b28; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  position: sticky; top: 0; z-index: 2; }
h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
h1 span { color: var(--muted); font-weight: 400; }
.live { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.dot.off { background: var(--p0); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.filters button { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.sep { width: 1px; background: var(--line); margin: 0 4px; }
.warnings { margin: 12px 20px 0; padding: 8px 12px; border-radius: 6px;
  background: var(--warn-bg); color: var(--warn-ink); font-size: 13px; }
main { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 14px;
  padding: 16px 20px 40px; align-items: start; overflow-x: auto; }
.col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  margin: 0 0 8px; display: flex; justify-content: space-between; }
.cards { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; box-shadow: var(--shadow); cursor: pointer; border-left: 3px solid var(--p2); }
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
.card.p0 { border-left-color: var(--p0); } .card.p1 { border-left-color: var(--p1); }
.card.p3 { border-left-color: var(--p3); }
.meta { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.id { font-family: var(--mono); }
.chip { background: var(--chip); border-radius: 4px; padding: 0 5px; }
.title { font-weight: 500; }
.blocked { margin-top: 6px; font-size: 12px; color: var(--p0); }
.empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }
/* détail */
.drawer { position: fixed; inset: 0 0 0 auto; width: min(640px, 100%); background: var(--panel);
  border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .15s ease;
  display: flex; flex-direction: column; z-index: 3; }
.drawer.open { transform: none; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none;
  transition: opacity .15s; z-index: 2; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer header { position: static; }
.drawer header h2 { font-size: 16px; margin: 0; flex: 1; }
.close { border: 0; background: none; color: var(--muted); font-size: 20px; cursor: pointer; }
.tabs { display: flex; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; color: var(--muted); font: inherit; padding: 10px 10px;
  cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.doc { padding: 16px 20px 40px; overflow-y: auto; }
.doc h1, .doc h2, .doc h3 { font-size: 14px; margin: 18px 0 6px; }
.doc p, .doc ul { margin: 6px 0; } .doc ul { padding-left: 20px; }
.doc code { font-family: var(--mono); font-size: 12px; background: var(--chip); padding: 0 3px; border-radius: 3px; }
.doc li.task { list-style: none; margin-left: -20px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12px;
  padding: 12px 20px; border-bottom: 1px solid var(--line); color: var(--muted); }
.facts b { color: var(--ink); font-weight: 500; }
</style>
</head>
<body>
<header>
  <h1>coutcouticket <span id="summary"></span></h1>
  <div class="live"><span class="dot" id="dot"></span><span id="live">à jour</span></div>
  <div class="filters" id="filters"></div>
</header>
<div class="warnings" id="warnings" hidden></div>
<main id="board"></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header><h2 id="d-title"></h2><button class="close" id="d-close" aria-label="Fermer">×</button></header>
  <div class="facts" id="d-facts"></div>
  <div class="tabs" role="tablist" id="d-tabs"></div>
  <div class="doc" id="d-doc"></div>
</aside>
<script>
// Source des données : maquette (window.MOCK) ou démon (/ui/api/…).
const MOCK = window.MOCK || null;
const api = {
  overview: () => MOCK ? Promise.resolve(MOCK.overview) : fetch('api/overview').then(r => r.json()),
  detail: (t) => MOCK ? Promise.resolve(MOCK.details[t.project + '/' + t.id])
    : fetch('api/ticket?project=' + encodeURIComponent(t.project_path) + '&id=' + t.id).then(r => r.json()),
};
const COLS = [['in-progress', 'En cours'], ['review', 'En revue'], ['blocked', 'Bloqué'], ['todo', 'À faire']];
const state = { data: null, project: null, prio: null };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render() {
  const d = state.data;
  const shown = d.tickets.filter(t => (!state.project || t.project === state.project) && (!state.prio || t.priority === state.prio));
  const projects = [...new Set(d.tickets.map(t => t.project))];
  $('summary').textContent = `· ${shown.length} ticket(s) ouvert(s) · ${d.projects} projet(s)`;
  const f = $('filters');
  f.innerHTML = '';
  const btn = (label, on, click) => { const b = document.createElement('button'); b.textContent = label;
    b.setAttribute('aria-pressed', on); b.onclick = click; f.append(b); };
  btn('Tous', !state.project, () => { state.project = null; render(); });
  projects.forEach(p => btn(p, state.project === p, () => { state.project = p; render(); }));
  f.append(Object.assign(document.createElement('span'), { className: 'sep' }));
  ['p0', 'p1', 'p2', 'p3'].forEach(p => btn(p, state.prio === p, () => { state.prio = state.prio === p ? null : p; render(); }));
  const w = $('warnings');
  w.hidden = !d.warnings.length;
  w.textContent = d.warnings.map(x => x.message || x).join(' · ');
  const board = $('board');
  board.innerHTML = '';
  for (const [status, label] of COLS) {
    const list = shown.filter(t => t.status === status);
    const col = document.createElement('section');
    col.className = 'col';
    col.innerHTML = `<h2><span>${label}</span><span>${list.length}</span></h2><div class="cards"></div>`;
    const cards = col.querySelector('.cards');
    if (!list.length) cards.innerHTML = '<div class="empty">Aucun ticket</div>';
    for (const t of list) {
      const c = document.createElement('article');
      c.className = 'card ' + t.priority;
      c.tabIndex = 0;
      c.innerHTML = `<div class="meta"><span class="id">${t.id}</span><span class="chip">${esc(t.project)}</span>
        <span class="chip">${t.type}</span><span>${t.priority}</span></div>
        <div class="title">${esc(t.title)}</div>
        ${t.open_blockers.length ? `<div class="blocked">⛔ bloqué par ${t.open_blockers.join(', ')}</div>` : ''}`;
      c.onclick = () => open(t);
      c.onkeydown = (e) => { if (e.key === 'Enter') open(t); };
      cards.append(c);
    }
    board.append(col);
  }
}

// Markdown minimal : titres, listes, cases à cocher, gras, code. Tout le texte est échappé.
function md(src) {
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  let out = '', inList = false;
  for (const line of src.split('\n')) {
    const h = line.match(/^(#{1,3}) (.*)/), li = line.match(/^\s*[-*] (.*)/);
    if (!li && inList) { out += '</ul>'; inList = false; }
    if (h) out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    else if (li) {
      if (!inList) { out += '<ul>'; inList = true; }
      const task = li[1].match(/^\[( |x)\] (.*)/);
      out += task ? `<li class="task">${task[1] === 'x' ? '☑' : '☐'} ${inline(task[2])}</li>` : `<li>${inline(li[1])}</li>`;
    } else if (line.trim()) out += `<p>${inline(line)}</p>`;
  }
  return out + (inList ? '</ul>' : '');
}

async function open(t) {
  const det = await api.detail(t);
  $('d-title').textContent = `${t.id} · ${t.title}`;
  $('d-facts').innerHTML = [['Projet', t.project], ['Statut', t.status], ['Priorité', t.priority],
    ['Type', t.type], ['Branche', t.branch], ['Dépend de', t.blocked_by.join(', ') || '—']]
    .map(([k, v]) => `<span>${k}</span><b>${esc(v)}</b>`).join('');
  const tabs = [['ticket', 'Ticket'], ['decisions', 'Décisions'], ['journal', 'Journal']];
  const show = (key) => {
    $('d-doc').innerHTML = md(det[key] || '');
    [...$('d-tabs').children].forEach(b => b.setAttribute('aria-selected', b.dataset.k === key));
  };
  $('d-tabs').innerHTML = tabs.map(([k, l]) => `<button role="tab" data-k="${k}">${l}</button>`).join('');
  [...$('d-tabs').children].forEach(b => b.onclick = () => show(b.dataset.k));
  show('ticket');
  $('drawer').classList.add('open'); $('scrim').classList.add('open');
  $('drawer').setAttribute('aria-hidden', 'false');
}
function close() { $('drawer').classList.remove('open'); $('scrim').classList.remove('open');
  $('drawer').setAttribute('aria-hidden', 'true'); }
$('d-close').onclick = close; $('scrim').onclick = close;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

async function refresh() { state.data = await api.overview(); render(); }
refresh();
// Mise à jour poussée par le démon (SSE) : aucun sondage.
if (!MOCK) {
  const es = new EventSource('api/events');
  es.onmessage = refresh;
  es.onopen = () => { $('dot').className = 'dot'; $('live').textContent = 'à jour'; };
  es.onerror = () => { $('dot').className = 'dot off'; $('live').textContent = 'démon injoignable, reconnexion…'; };
} else { $('live').textContent = 'maquette (données figées)'; }
</script>
</body>
</html>
